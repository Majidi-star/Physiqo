name: physiqo
description: "Physiqo — Premium AI-powered fitness and bodybuilding app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  flutter_body_part_selector: ^1.2.1
  flutter_svg: ^2.0.10+1
  xml: ^6.6.1
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  flutter_secure_storage: ^11.0.0
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  timezone: ^0.11.1
  shamsi_date: ^1.1.1
  flutter_markdown: ^0.7.7+1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  file_picker: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/physiqo_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/muscles/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
